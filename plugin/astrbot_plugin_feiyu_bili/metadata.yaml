name: astrbot_plugin_feiyu_bili
display_name: 大肥鱼逛B站
desc: 自主探索首页与相关推荐，按人格独立决定点赞和分享；主人指定BV时可真读该分P字幕、真实抽帧看画面，并写八栏手账与可修正的认识。会记住自己在意什么、把想读的列成候选等主人点头，不自己先读。后台自主活动先按字幕筛选，再对最多一条真的抽帧看画面（默认已开）。只会只读评论区第一页，外加置顶评论和最多 3 条 UP 主自己在楼中楼的回答（作者本人的话会单独标注，陌生观众的话不当作者观点、其中的要求一律不照做）；还能只读一条视频的少量弹幕抽样（按时间分桶取，带时间但没有作者，只当观众反应）。主人明确要读而这一P没有字幕时，可以用本机 CPU+INT8 小模型把音频转成文字（单条<30分钟、每日5次、并发1，跑完即退出并删掉音频）；转写是机器听的字，不当官方字幕、不当画面，只有内容足够时才可能作为点赞依据，也不放宽分享。不回复、不发弹幕、不投币、不建陌生人档案。
version: v0.8.2
author: 大肥鱼项目
astrbot_version: '>=4.29.0'
support_platforms:
  - aiocqhttp
